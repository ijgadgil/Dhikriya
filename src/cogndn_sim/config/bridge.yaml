# ros_gz_bridge mapping for the Prius in the generated cogndn_town worlds
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /vla/camera/image_raw
  gz_topic_name: /world/cogndn_town/model/prius_vla/link/chassis/sensor/front_camera_sensor/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /vla/points
  gz_topic_name: /world/cogndn_town/model/prius_vla/link/chassis/sensor/center_laser_sensor/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
- ros_topic_name: /vla/odom
  gz_topic_name: /model/prius_vla/odometry_gt
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /vla/wheel_odom
  gz_topic_name: /model/prius_vla/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /model/prius_vla/cmd_vel
  gz_topic_name: /model/prius_vla/cmd_vel
  ros_type_name: geometry_msgs/msg/Twist
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
