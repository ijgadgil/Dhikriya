# Placement of the earlier project's Mcity map (model city_vla, files unchanged) under the SAME road graph as town.yaml.
# The scenarios, ground truth, content names and evaluation are unchanged; only the 3D world differs.
#
# Scale: mcity.obj is not in metres. 0.15 makes a two-lane road 7.2 m wide and the site ~32 acres,
# matching the real Mcity facility. (The earlier project loaded it at scale 1, i.e. roads ~50 m wide.)
scale: 0.15
# Mesh point (mesh units) that becomes junction x1 = town (105, 0): centre of the junction between
# Mcity's long north-south straight and the east-west boulevard, offset so the Prius lanes sit on asphalt.
junction_mesh: [482.0, 43.0]
# Town +x (main road direction) runs along Mcity north, so the mesh is rotated by -90 degrees.
yaw_deg: -90.0
# Mcity roads are wider than the 7 m town road: move roadside signs out to the real kerb,
# and make the closure barrier span the whole carriageway.
sign_shift_m: 3.0      # signs on the paved shoulder, inside the camera view when the text is readable
barrier_width_m: 30.0
# The city_vla buildings are facades only (no back walls, no roofs), so they look hollow from above or behind.
# Solid blocks [x0, y0, x1, y1, height] in mesh units are drawn just inside the facades to close them.
buildings:
  - [-543.5, -416.5, -455.5, -331.5, 41.7]   # west L-block, low wing
  - [-490.0, -416.5, -455.5, -331.5, 76.0]   # west L-block, tower along the east facade
  - [-515.5, -252.5, -451.5, -176.0, 41.7]   # middle block, low part
  - [-515.5, -176.0, -451.5, -97.5, 76.0]    # middle block, tall part
  - [-242.5, -426.5, -181.5, -349.0, 41.7]   # east L-block, west wing
  - [-242.5, -349.0, -181.5, -193.0, 76.0]
  - [-242.5, -193.0, -181.5, -116.5, 41.7]
  - [-178.0, -426.5, 21.5, -365.0, 76.0]     # east L-block, south wing
  - [-242.5, -426.5, -178.0, -365.0, 41.7]
